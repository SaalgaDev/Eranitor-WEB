<app-nav-sidebar />
<div class="dash-main">
  <router-outlet />
</div>
<p class="dash-footnote">Seus dados ficam salvos na sua conta Eranitor e aparecem também no app.</p>

<div class="dash-toast-area" role="alert" aria-live="assertive">
  @if (aviso()) {
    <div class="dash-toast">
      <span>{{ aviso() }}</span>
      <button type="button" class="dash-toast__close" (click)="fecharAviso()" aria-label="Fechar aviso">×</button>
    </div>
  }
</div>

@if (confirm.current(); as request) {
  <app-dialog [title]="request.title" (close)="confirm.answer(false)">
    <p class="dialog__text">{{ request.message }}</p>
    <div class="dialog__actions">
      <button type="button" class="btn btn--ghost" (click)="confirm.answer(false)">Cancelar</button>
      <button type="button" class="btn btn--danger" (click)="confirm.answer(true)">{{ request.confirmLabel }}</button>
    </div>
  </app-dialog>
}
