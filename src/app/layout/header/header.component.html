<header class="header">
  <div class="container header__row">
    <app-logo />

    <button
      type="button"
      class="header__toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-controls="primary-nav"
    >
      <span class="sr-only">{{ menuOpen ? 'Fechar menu' : 'Abrir menu' }}</span>
      <span class="header__toggle-bar" [class.is-open]="menuOpen"></span>
    </button>

    <nav
      id="primary-nav"
      class="header__nav"
      [class.header__nav--open]="menuOpen"
      aria-label="Navegação principal"
    >
      <ul class="header__pills">
        @for (link of navLinks; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="is-active"
              (click)="closeMenu()"
              class="header__pill"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <a
        routerLink="/baixar"
        routerLinkActive="is-active"
        (click)="closeMenu()"
        class="header__pill header__pill--cta"
      >
        Download
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 4v12M6 12l6 6 6-6M5 21h14" />
        </svg>
      </a>
    </nav>
  </div>
</header>
