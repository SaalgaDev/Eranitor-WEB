@if (routerLink) {
  <a
    [routerLink]="routerLink"
    class="cta"
    [class]="'cta--' + variant + ' cta--' + size"
  >
    <ng-content></ng-content>
  </a>
} @else {
  <a
    [href]="href"
    class="cta"
    [class]="'cta--' + variant + ' cta--' + size"
  >
    <ng-content></ng-content>
  </a>
}
