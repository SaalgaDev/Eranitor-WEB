@if (route !== null) {
  <a
    [routerLink]="route"
    class="logo logo--{{ kind }}"
    [class.logo--large]="size === 'large'"
    [attr.aria-label]="'logo.home' | translate"
  >
    <span class="logo__mark" [style.--logo-src]="maskUrl" aria-hidden="true"></span>
  </a>
} @else {
  <span
    class="logo logo--{{ kind }}"
    [class.logo--large]="size === 'large'"
    role="img"
    aria-label="Eranitor"
  >
    <span class="logo__mark" [style.--logo-src]="maskUrl" aria-hidden="true"></span>
  </span>
}
