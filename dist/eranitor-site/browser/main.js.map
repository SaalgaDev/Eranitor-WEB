<a routerLink="/" class="logo" [class.logo--dark]="variant === 'dark'" aria-label="Eranitor — página inicial">
  @if (imageAvailable) {
    <img class="logo__image" [src]="src" alt="Eranitor" (error)="onImageError()" />
  } @else {
    <span class="logo__fallback" aria-hidden="true">ERANITOR</span>
  }
</a>
