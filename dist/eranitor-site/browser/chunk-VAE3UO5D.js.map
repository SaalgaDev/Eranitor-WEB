<div class="phone" [class.phone--float]="variant === 'float'">
  @if (imageAvailable) {
    <img
      class="phone__image"
      [src]="src"
      alt="Prévia do aplicativo Eranitor"
      (error)="onImageError()"
    />
  } @else {
    <div class="phone__placeholder" role="img" aria-label="Prévia do aplicativo Eranitor">
      <span>Prévia do app</span>
      <small>Adicione <strong>tela1.png</strong> em assets/images</small>
    </div>
  }
</div>
