<app-page-hero
  eyebrowKey="page.contact.eyebrow"
  titleKey="page.contact.title"
  leadKey="page.contact.lead"
/>

<section class="section">
  <div class="container container--narrow">
    <div class="channels-grid">
      @for (c of channels; track c.titleKey; let i = $index) {
        <a [href]="c.href" class="channel-card" appReveal [revealDelay]="i * 90" rel="noopener noreferrer">
          <span class="channel-card__icon" aria-hidden="true">
            @if (c.icon === 'mail') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" /></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5" /><circle cx="12" cy="12" r="4" /><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" /></svg>
            }
          </span>
          <span class="channel-card__title">{{ c.titleKey | translate }}</span>
          <span class="channel-card__value">{{ c.valueKey ? (c.valueKey | translate) : c.value }}</span>
        </a>
      }
    </div>
    <p class="channels-note" appReveal>
      {{ 'page.contact.note' | translate }}
    </p>
  </div>
</section>
